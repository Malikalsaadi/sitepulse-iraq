[build]
  command = "mkdir -p dist && cp index.html analytics.html app.js styles.css feedback.js analytics.js analytics-admin.js daily-report.html daily-report.css daily-report.js daily-pdf-buttons.js cloud.js sas.html sas.css sas.js dist/"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
