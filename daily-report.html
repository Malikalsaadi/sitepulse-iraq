<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>SitePulse Daily Site Report</title>
<link rel="stylesheet" href="daily-report.css">
</head>
<body>
<div class="toolbar noprint">
  <a class="btn secondary" href="/">Back to SitePulse</a>
  <button id="langToggle" class="btn secondary">العربية</button>
  <button id="emailReport" class="btn secondary">Prepare Email</button>
  <button id="printReport" class="btn primary">Print / Save PDF</button>
</div>
<div class="print-help noprint" id="printHelp">For a clean PDF: choose A4 and turn off browser headers & footers.</div>
<main id="reportRoot">
  <article class="sheet">
    <header class="report-header">
      <div class="company-block">
        <img id="companyLogo" alt="Company logo">
        <div>
          <div id="companyName" class="company-name">SitePulse Client Company</div>
          <div id="reportTitle" class="report-title">DAILY SITE REPORT</div>
        </div>
      </div>
      <div class="report-code">
        <div id="reportNumber">DSR</div>
        <small id="generatedBy">Generated by SitePulse Iraq</small>
      </div>
    </header>

    <section class="meta-grid" id="metaGrid"></section>

    <section id="reportSections" class="sections"></section>

    <section class="signatures">
      <div><b id="preparedLabel">Prepared by</b><span id="preparedValue"></span><div class="signature-line"></div></div>
      <div><b id="reviewedLabel">Reviewed by</b><span>&nbsp;</span><div class="signature-line"></div></div>
    </section>

    <footer class="report-footer">
      <span id="footerLeft">SitePulse Iraq - Daily Site Report</span>
      <span id="footerRight"></span>
    </footer>
  </article>
</main>
<div id="reportError" class="error noprint" hidden></div>
<script src="daily-report.js"></script>
</body>
</html>
